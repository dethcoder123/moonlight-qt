---
name: Build - Windows ARM64
permissions:
  contents: read

on:
  workflow_call:
    inputs:
      ci_version:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      ci_version:
        description: Version string used for the release artifacts
        required: true
        type: string

jobs:
  build-arm64:
    env:
      CI_VERSION: ${{ inputs.ci_version }}
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        qt_version: ['6.11.1']

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Download dependencies (Windows)
        run: powershell ./setup-deps.ps1

      - name: Install Qt host tools (Windows x64)
        uses: jurplel/install-qt-action@v4
        with:
          cache: true
          set-env: false
          add-tools-to-path: false
          version: ${{ matrix.qt_version }}
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@073e34d7c2ab4ae6961ed7cca690b3abd5ba5a7e'

      - name: Install Qt ARM64 (Windows)
        uses: jurplel/install-qt-action@v4
        with:
          cache: true
          set-env: false
          add-tools-to-path: false
          arch: win64_msvc2022_arm64_cross_compiled
          version: ${{ matrix.qt_version }}

      - name: Build ARM64 binaries (Windows)
        shell: cmd
        run: |
          set "PATH=%QT_PATH%;%PATH%"
          scripts\build-arch.bat Release arm64
        env:
          QT_PATH: ${{ github.workspace }}\..\Qt\${{ matrix.qt_version }}\msvc2022_arm64\bin

      - name: Build VRR replay (Windows arm64)
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`scripts\vswhere.exe -latest -property installationPath`) do call "%%i\VC\Auxiliary\Build\vcvarsall.bat" amd64_arm64
          if errorlevel 1 exit /b 1
          set "PATH=%QT_PATH%;%PATH%"
          mkdir build\tests-vrr-arm64\vrr
          cd build\tests-vrr-arm64\vrr
          if exist "%QT_PATH%\qmake.bat" (
            call "%QT_PATH%\qmake.bat" ..\..\..\tests\vrr\replay.pro CONFIG+=release
          ) else if exist "%QT_PATH%\host-qmake.bat" (
            call "%QT_PATH%\host-qmake.bat" ..\..\..\tests\vrr\replay.pro CONFIG+=release
          ) else (
            qmake.exe ..\..\..\tests\vrr\replay.pro CONFIG+=release
          )
          if errorlevel 1 exit /b 1
          nmake
          if errorlevel 1 exit /b 1
        env:
          QT_PATH: ${{ github.workspace }}\..\Qt\${{ matrix.qt_version }}\msvc2022_arm64\bin

      - name: Recreate Windows ARM64 portable ZIP with diagnostics
        shell: pwsh
        run: |
          $deploy = (Resolve-Path build/deploy-arm64-release).Path
          Copy-Item build/tests-vrr-arm64/vrr/release/vrrreplay.exe $deploy
          Copy-Item scripts/decode-vrr-trace.py $deploy
          if (!(Test-Path "$deploy/portable.dat.inactive") -or (Test-Path "$deploy/portable.dat")) {
            throw "Incorrect portable settings marker"
          }
          Compress-Archive -Path "$deploy/*" -CompressionLevel Optimal -Force `
            -DestinationPath "build/installer-arm64-release/MoonlightPortable-arm64-$env:CI_VERSION.zip"

      - name: Upload Portable ZIP (Windows arm64)
        uses: actions/upload-artifact@v6
        with:
          name: MoonlightPortable-Windows-arm64-${{ env.CI_VERSION }}
          path: build/installer-arm64-release/MoonlightPortable-arm64-${{ env.CI_VERSION }}.zip
          compression-level: 0
          if-no-files-found: error
