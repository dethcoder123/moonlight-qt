---
name: Build
permissions:
  contents: read

on:
  push:
  pull_request:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-input-motion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Test SDL controller motion rates
        env:
          CXXFLAGS: -fsanitize=address,undefined -fno-omit-frame-pointer
        run: python3 tests/input/test_gamepad_motion_rate.py

  # The Steam Controller (2026) driver suite natively on Linux under ASan/UBSan: the manager's
  # enumeration policies are exercised for both platforms' HID layouts, and the suite does not
  # depend on the Windows job, where an earlier test step can fail first.
  test-steam-controller:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - name: Test the Steam Controller (2026) driver (Linux, ASan/UBSan)
        run: |
          g++ -std=c++17 -g -fsanitize=address,undefined -fno-omit-frame-pointer \
            -DMOONLIGHT_STEAMCONTROLLER_TEST \
            -Itests/steamcontroller/support -Iapp -Imoonlight-common-c/moonlight-common-c/src \
            tests/steamcontroller/tst_steamcontroller.cpp \
            app/streaming/input/steamcontroller/steamcontrollerattributes.cpp \
            app/streaming/input/steamcontroller/steamcontrollercore.cpp \
            app/streaming/input/steamcontroller/steamcontrollerlink.cpp \
            app/streaming/input/steamcontroller/steamcontrollerhost.cpp \
            -pthread -o build-tst_steamcontroller
          ./build-tst_steamcontroller

  setup:
    runs-on: ubuntu-latest
    outputs:
      ci_version: ${{ steps.set-ci-version.outputs.ci_version }}
    steps:
      - name: Set CI version
        id: set-ci-version
        shell: bash
        run: |
          CI_VERSION=`echo ${GITHUB_SHA} | cut -c1-6`
          echo "ci_version=${CI_VERSION}" >> "${GITHUB_OUTPUT}"

  build-appimage:
    needs: setup
    uses: ./.github/workflows/build-appimage.yml
    with:
      ci_version: ${{ needs.setup.outputs.ci_version }}

  build-steamlink:
    needs: setup
    uses: ./.github/workflows/build-steamlink.yml
    with:
      ci_version: ${{ needs.setup.outputs.ci_version }}

  build-windows-macos:
    needs: setup
    uses: ./.github/workflows/build-win-mac.yml
    with:
      ci_version: ${{ needs.setup.outputs.ci_version }}

  publish-release:
    needs: [setup, build-windows-macos]
    if: github.event_name != 'pull_request' && (github.ref_name == 'master' || github.ref_name == 'main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      CI_VERSION: ${{ needs.setup.outputs.ci_version }}
    steps:
      - name: Download Windows ARM64 Portable ZIP
        uses: actions/download-artifact@v6
        with:
          name: MoonlightPortable-Windows-arm64-${{ needs.setup.outputs.ci_version }}
          path: release-assets

      - name: Download Windows Release Packages
        uses: actions/download-artifact@v6
        with:
          name: Moonlight-Windows-Release-${{ needs.setup.outputs.ci_version }}
          path: release-assets

      - name: Publish GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          TAG="v6.1.0-arm64-${CI_VERSION}"
          if gh release view "$TAG" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --repo "${GITHUB_REPOSITORY}" --clobber
          else
            gh release create "$TAG" release-assets/* \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${GITHUB_SHA}" \
              --title "Moonlight Windows ARM64 & x64 (${CI_VERSION})" \
              --notes "Native Windows ARM64 (Snapdragon X Elite) and x64 build from commit ${GITHUB_SHA}."
          fi
